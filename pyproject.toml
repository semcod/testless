[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "testless"
version = "0.1.8"
description = "Analyze test value, coverage, duplication, and generate LLM planfiles"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
keywords = ["testing", "coverage", "analysis", "llm", "planfile"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Testing",
]
dependencies = [
  "click>=8.1",
  "coverage>=7.0",
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "pydantic>=2.7",
  "PyYAML>=6.0",
  "networkx>=3.0",
]

[project.optional-dependencies]
dev = [
  "ruff>=0.4",
  "mypy>=1.10",
  "costs>=0.1.20",
]

[project.scripts]
testless = "testless.cli:main"
pretest = "testless.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
filterwarnings = [
  "ignore::pytest.PytestCollectionWarning",
]

[tool.ruff]
src = ["src"]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.mypy]
python_version = "3.11"
strict = false
warn_unused_configs = true

[tool.costs]
# AI Cost tracking configuration
badge = true
update_readme = true
readme_path = "README.md"
default_model = "openrouter/qwen/qwen3-coder-next"
analysis_mode = "byok"
full_history = true
max_commits = 500

# Cost thresholds for badge colors (USD)
badge_color_thresholds = { low = 1.0, medium = 5.0, high = 10.0, critical = 50.0 }

[tool.uv.dependency-groups.automation]
requires-python = ">=3.12"

[dependency-groups]
automation = ["goal>=2.2.0"]
